name: Deploy standalone demo (AWS)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ratification-demo-aws-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_SITE_BUCKET: ${{ vars.AWS_SITE_BUCKET }}
      AWS_SITE_DISTRIBUTION_ID: ${{ vars.AWS_SITE_DISTRIBUTION_ID }}
      AWS_SITE_DEPLOY_ROLE_ARN: ${{ vars.AWS_SITE_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build static export
        run: pnpm build
      - name: Check deploy configuration
        shell: bash
        run: |
          missing=0
          for v in AWS_SITE_BUCKET AWS_SITE_DISTRIBUTION_ID AWS_SITE_DEPLOY_ROLE_ARN AWS_REGION; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable $v is not set."
              missing=1
            fi
          done
          test -f out/index.html || { echo "::error::out/index.html is missing"; missing=1; }
          exit "$missing"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SITE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync immutable Next.js assets
        run: |
          aws s3 sync out/ "s3://$AWS_SITE_BUCKET/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" \
            --include "_next/static/*"
      - name: Sync pages and public files
        run: |
          aws s3 sync out/ "s3://$AWS_SITE_BUCKET/" \
            --delete \
            --cache-control "public,max-age=300" \
            --exclude "_next/static/*"
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$AWS_SITE_DISTRIBUTION_ID" \
            --paths "/*"
